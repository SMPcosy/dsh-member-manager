<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>成员管理 · 组织架构（右侧边栏 tab）</title>
<style>
  :root{
    --line:rgba(31,35,40,.14);
    --muted:#6b747e;
    --blue:#2f6feb;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#f6f7f9;color:#1f2328;
    font:13px/1.5 ui-sans-serif,system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;
  }
  .topbar{
    flex:none;height:38px;display:flex;align-items:center;gap:8px;
    padding:0 14px;border-bottom:1px solid var(--line);background:#fff;
    font-size:12px;color:#57606a;
  }
  .topbar .dot{width:7px;height:7px;border-radius:50%;background:#1a7f37}
  .topbar .tag{margin-left:auto;font-size:11px;color:#8c959f}
  .app{flex:1;min-height:0;display:flex}
  .chat{
    flex:1;min-width:0;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#fbfcfd,#f4f6f9);
  }
  .chat-head{
    flex:none;padding:10px 18px;border-bottom:1px solid rgba(31,35,40,.06);
    font-size:12px;color:#8c959f;
  }
  .bubble{
    margin:14px 18px 0;max-width:560px;background:#fff;border:1px solid rgba(31,35,40,.1);
    border-radius:12px;padding:10px 12px;box-shadow:0 1px 2px rgba(15,23,42,.04);
  }
  .bubble.me{margin-left:auto;background:#eaf1ff;border-color:rgba(47,111,235,.22)}
  .bubble b{font-weight:600}
  .bubble p{margin:4px 0 0;color:#4a525b;font-size:12px}
  .composer{
    margin:auto 18px 16px;height:38px;border:1px solid var(--line);border-radius:10px;
    background:#fff;display:flex;align-items:center;padding:0 12px;color:#9aa2ab;font-size:12px;
  }

  /* 右侧边栏：面板本体没有窗口框，只有 shell 的 tab 条 */
  .rail{
    flex:none;width:1010px;min-width:0;display:flex;flex-direction:column;
    background:#fff;border-left:1px solid var(--line);
  }
  .rail-tabs{
    flex:none;height:36px;display:flex;align-items:center;gap:6px;padding:0 10px;
    border-bottom:1px solid rgba(31,35,40,.08);background:#fbfcfd;
  }
  .rail-tab{
    height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:7px;
    font-size:12px;color:#57606a;background:#eef1f5;
  }
  .rail-tab.on{background:#fff;color:#1f2328;border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,23,42,.05)}
  .rail-tab .g{width:6px;height:6px;border-radius:50%;background:#1a7f37}
  .rail-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}

  .mmo-toolbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px 2px}
.mmo-toolbar-label{font-size:11px;color:var(--muted);white-space:nowrap}
.mmo-select{flex:1;min-width:0;font:11px/1.5 inherit;padding:3px 8px;border:1px solid rgba(31,35,40,.18);border-radius:6px;background:#fff;color:var(--ink)}
.mmo-canvas{flex:1;min-height:0;overflow:auto;padding:8px 12px 4px;position:relative}
  .mmo-stage{position:relative;width:max-content;min-width:100%;padding:2px 4px 10px}
  .mmo-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
  .mmo-lead-row{position:relative;z-index:1;display:flex;justify-content:center}
  .mmo-lead-row .mmo-card{width:230px}
  .mmo-groups{
    position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:center;
    gap:24px;margin-top:36px;
  }
  .mmo-cluster{display:flex;flex-direction:column;align-items:center;gap:12px}
  .mmo-chip{
    display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:3px 8px;
    font-size:11px;font-weight:600;color:#fff;background:var(--blue);
    box-shadow:0 1px 2px rgba(23,32,46,.12);white-space:nowrap;
  }
  .mmo-chip[data-gi="0"]{background:#2f6feb}
  .mmo-chip[data-gi="1"]{background:#b45309}
  .mmo-chip[data-gi="2"]{background:#1a7f37}
  .mmo-chip[data-gi="3"]{background:#8250df}
  .mmo-chip-count{background:rgba(255,255,255,.24);border-radius:999px;padding:0 5px;font-size:10px;font-weight:500}
  .mmo-members{display:flex;align-items:stretch;gap:10px}
  .mmo-card{
    width:180px;border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:#fff;
    position:relative;transition:border-color .2s,box-shadow .2s;
  }
  .mmo-card[data-active="1"]{border-color:rgba(47,111,235,.55);box-shadow:0 0 0 2px rgba(47,111,235,.12)}
  .mmo-card[data-running="1"]{background:linear-gradient(180deg,rgba(47,111,235,.06),#fff)}
  .mmo-row1{display:flex;align-items:center;gap:5px;min-width:0}
  .mmo-dot{width:7px;height:7px;border-radius:50%;background:#b8bfc7;flex:none}
  .mmo-dot[data-state="running"]{background:#1a7f37;animation:pulse 1.4s ease-in-out infinite}
  .mmo-dot[data-state="idle"]{background:#8c959f}
  .mmo-name{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mmo-model{
    font-size:10px;color:var(--muted);background:#f3f5f8;border-radius:5px;padding:1px 4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;flex:none;
  }
  .mmo-task{
    font-size:11px;color:#4a525b;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden;
  }
  .mmo-task[data-empty="1"]{color:#9aa2ab}
  .mmo-meta{display:flex;gap:6px;margin-top:3px;font-size:10px;color:var(--muted);flex-wrap:wrap}
  .mmo-badge{font-size:9px;border-radius:4px;padding:0 4px;background:rgba(47,111,235,.12);color:var(--blue)}
  .mmo-ok{background:rgba(26,127,55,.12);color:#1a7f37}
  .mmo-foot{flex:none;display:flex;gap:10px;flex-wrap:wrap;padding:4px 12px 8px;font-size:10px;color:var(--muted)}
  .mmo-branch{fill:none;stroke:rgba(100,116,139,.55);stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
  .mmo-edge{fill:none;stroke:rgba(47,111,235,.5);stroke-width:1.4;stroke-linejoin:round}
  .mmo-edge[data-kind="dep"]{stroke:rgba(154,103,0,.55);stroke-dasharray:3 3}
  .mmo-edge-active{stroke:#2f6feb;stroke-width:2;stroke-dasharray:7 5;animation:dash .8s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-24}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(26,127,55,.45)}50%{box-shadow:0 0 0 4px rgba(26,127,55,0)}}
</style>
</head>
<body>
  <div class="topbar">
    <span class="dot"></span>
    <b>DeepSeek Harness</b>
    <span>独立演示 · 非真实会话</span>
    <span class="tag">右侧边栏 tab「组织架构」· 按会话（任务）显示 · 下拉切换</span>
  </div>

  <div class="app">
    <div class="chat">
      <div class="chat-head">模拟会话区：右栏的组织架构图只显示「当前任务」的参与者，顶部下拉可切换任务。</div>
      <div class="bubble">
        <b>大总管</b>
        <p>一个会话就是一个任务。当前任务需要谁工作，图上就只出现谁。</p>
      </div>
      <div class="bubble me">
        <b>你</b>
        <p>只显示当前小组的可视化工作流。</p>
      </div>
      <div class="bubble">
        <b>插件架构</b>
        <p>按会话区分任务，下拉切换；图里只保留该任务的参与者，布局仍是并联横向、串联纵向。</p>
      </div>
      <div class="composer">输入消息…（演示页不接收输入）</div>
    </div>

    <div class="rail">
      <div class="rail-tabs">
        <span class="rail-tab">会话</span>
        <span class="rail-tab on"><span class="g"></span>组织架构</span>
      </div>
      <div class="rail-body">
        <div class="mmo-toolbar">
          <span class="mmo-toolbar-label">任务</span>
          <select class="mmo-select" id="taskSel" aria-label="任务"></select>
        </div>
        <div class="mmo-canvas" id="canvas">
          <div class="mmo-stage" id="stage">
            <svg class="mmo-svg" id="svg" aria-hidden="true"></svg>
            <div class="mmo-lead-row" id="leadRow"></div>
            <div class="mmo-groups" id="groupsRow"></div>
          </div>
        </div>
        <div class="mmo-foot" id="foot"></div>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var GROUP_COLORS = ["#2f6feb", "#b45309", "#1a7f37", "#8250df", "#0e7490", "#b42318"];
  var MAX_EDGES = 12;

  function member(o) {
    return Object.assign({ tokens: 0, requests: 0, elapsed: 0, status: "idle", work: null }, o);
  }

  // 一个 root 会话 = 一个任务；每个任务只包含它自己的参与者。
  var TASKS = [
    {
      id: "s-a",
      title: "重构成员管理插件",
      running: true,
      updated: Date.now(),
      lead: member({
        target: "lead", displayName: "大总管", title: "总经理", status: "running",
        model: "v4-pro-0813", tokens: 48200, requests: 9, elapsed: 184000,
        work: { subject: "统筹 0.3.0 任务作用域改造", status: "in_progress" }
      }),
      groups: [
        {
          id: "g-plugin", name: "插件组", gi: 0, members: [
            member({ target: "plugin-arch", displayName: "插件架构", status: "running", model: "v4-pro-0813",
              tokens: 26400, requests: 6, elapsed: 152000, work: { subject: "会话作用域与任务识别", status: "in_progress" } }),
            member({ target: "plugin-builder", displayName: "插件编写", status: "running", model: "kimi-k2.7-code",
              tokens: 18800, requests: 4, elapsed: 96000, work: { subject: "任务下拉与作用域渲染", status: "in_progress" } }),
            member({ target: "plugin-reviewer", displayName: "插件审阅", status: "idle", model: "seed-2.1-pro",
              tokens: 7300, requests: 2, work: null })
          ]
        }
      ],
      dispatch: [
        { from: "lead", to: "plugin-arch", status: "in_progress" },
        { from: "lead", to: "plugin-builder", status: "pending" }
      ],
      dependency: [{ from: "plugin-arch", to: "plugin-builder", status: "in_progress" }]
    },
    {
      id: "s-b",
      title: "评估 billion-context",
      running: false,
      updated: Date.now() - 3600 * 1000,
      lead: member({
        target: "lead", displayName: "大总管", title: "总经理", status: "idle",
        model: "v4-pro-0813", tokens: 21600, requests: 5, elapsed: 92000,
        work: { subject: "汇总评估报告", status: "completed" }
      }),
      groups: [
        {
          id: "g-plugin", name: "插件组", gi: 0, members: [
            member({ target: "plugin-arch", displayName: "插件架构", status: "idle", model: "v4-pro-0813",
              tokens: 30400, requests: 7, elapsed: 138000, work: { subject: "安全性与外发通道核查", status: "completed" } })
          ]
        },
        {
          id: "g-kb", name: "知识库组", gi: 2, members: [
            member({ target: "data-verifier", displayName: "数据核查", status: "idle", model: "v4-pro-0813",
              tokens: 9100, requests: 2, elapsed: 45000, work: { subject: "复核价格与许可结论", status: "completed" } })
          ]
        }
      ],
      dispatch: [{ from: "lead", to: "plugin-arch", status: "completed" }],
      dependency: []
    }
  ];
  var current = 0;
  function task() { return TASKS[current]; }

  var $ = function (id) { return document.getElementById(id); };
  var canvas = $("canvas"), stage = $("stage"), svg = $("svg");
  var leadRow = $("leadRow"), groupsRow = $("groupsRow"), foot = $("foot"), taskSel = $("taskSel");
  var cards = Object.create(null);
  var layout = { lead: null, groups: [] };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = String(text);
    return n;
  }

  function fmtTok(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
    return String(Math.round(n));
  }
  function fmtDur(ms) {
    if (!ms || ms < 0) return "0 s";
    var s = Math.round(ms / 1000);
    if (s < 60) return s + " s";
    var m = Math.floor(s / 60);
    if (m < 60) return m + " 分 " + (s % 60) + " 秒";
    return Math.floor(m / 60) + " 小时 " + (m % 60) + " 分";
  }
  function shortText(text, max) {
    var s = String(text || "").replace(/\s+/g, " ").trim();
    return s.length <= max ? s : s.slice(0, max - 1) + "…";
  }

  function cardEl(m, gi) {
    var card = el("div", "mmo-card");
    var running = m.status === "running";
    var work = m.work;
    var inProgress = !!(work && work.status === "in_progress");
    card.setAttribute("data-target", m.target);
    if (running) card.setAttribute("data-running", "1");
    if (running || inProgress) card.setAttribute("data-active", "1");
    if (gi != null) card.setAttribute("data-gi", String(gi));

    var row1 = el("div", "mmo-row1");
    var dot = el("span", "mmo-dot");
    dot.setAttribute("data-state", running ? "running" : "idle");
    row1.appendChild(dot);
    var name = el("span", "mmo-name", m.displayName);
    name.title = m.displayName + (m.title ? " · " + m.title : "");
    row1.appendChild(name);
    var model = el("span", "mmo-model", m.model);
    model.title = m.model;
    row1.appendChild(model);
    card.appendChild(row1);

    var text = work ? work.subject : "";
    var taskLine = el("div", "mmo-task", text || "无进行中的工作包");
    if (!text) taskLine.setAttribute("data-empty", "1");
    card.appendChild(taskLine);

    var meta = el("div", "mmo-meta");
    meta.appendChild(el("span", "", fmtTok(m.tokens) + " tok"));
    meta.appendChild(el("span", "", (m.requests || 0) + " req"));
    meta.appendChild(el("span", "", fmtDur(m.elapsed)));
    if (work && work.status) {
      meta.appendChild(el("span", "mmo-badge" + (work.status === "completed" ? " mmo-ok" : ""), work.status));
    }
    card.appendChild(meta);
    return card;
  }

  function renderPicker() {
    var sig = TASKS.map(function (t) { return t.id + t.title + (t.running ? "1" : "0"); }).join("|") + "#" + current;
    if (taskSel.getAttribute("data-sig") === sig) {
      taskSel.value = task().id;
      return;
    }
    taskSel.setAttribute("data-sig", sig);
    taskSel.textContent = "";
    TASKS.forEach(function (t, i) {
      var opt = document.createElement("option");
      opt.value = t.id;
      opt.textContent = shortText(t.title, 24) + " · " + (t.groups.reduce(function (n, g) { return n + g.members.length; }, 0) + 1) + "人" + (t.running ? " ●" : "");
      if (i === current) opt.selected = true;
      taskSel.appendChild(opt);
    });
    taskSel.value = task().id;
  }

  function render() {
    var d = task();
    renderPicker();
    cards = Object.create(null);
    layout = { lead: null, groups: [] };
    leadRow.textContent = "";
    groupsRow.textContent = "";

    var leadCard = cardEl(d.lead, null);
    leadCard.setAttribute("data-role", "lead");
    cards[d.lead.target] = leadCard;
    leadRow.appendChild(leadCard);
    layout.lead = leadCard;

    d.groups.forEach(function (g) {
      var gi = g.gi;
      var cluster = el("div", "mmo-cluster");
      cluster.setAttribute("data-gi", String(gi));
      var chip = el("div", "mmo-chip");
      chip.setAttribute("data-gi", String(gi));
      chip.appendChild(el("span", "", g.name));
      chip.appendChild(el("span", "mmo-chip-count", String(g.members.length)));
      cluster.appendChild(chip);

      var row = el("div", "mmo-members");
      var list = [];
      g.members.forEach(function (m) {
        var c = cardEl(m, gi);
        cards[m.target] = c;
        row.appendChild(c);
        list.push(c);
      });
      cluster.appendChild(row);
      groupsRow.appendChild(cluster);
      layout.groups.push({ chip: chip, members: list, gi: gi });
    });

    var totals = d.lead.tokens;
    var reqs = d.lead.requests;
    var active = d.lead.status === "running" ? 1 : 0;
    d.groups.forEach(function (g) {
      g.members.forEach(function (m) {
        totals += m.tokens;
        reqs += m.requests;
        if (m.status === "running") active += 1;
      });
    });
    var count = d.groups.reduce(function (n, g) { return n + g.members.length; }, 1);

    foot.textContent = "";
    foot.appendChild(el("span", "", "任务 " + shortText(d.title, 18) + " · " + count + " 人"));
    foot.appendChild(el("span", "", "合计 " + fmtTok(totals) + " tok"));
    foot.appendChild(el("span", "", reqs + " req"));
    foot.appendChild(el("span", "", "活跃 " + active));
    foot.appendChild(el("span", "", "采样 " + new Date().toLocaleTimeString("zh-CN", { hour12: false })));

    requestAnimationFrame(draw);
  }

  function rectOf(node) {
    if (!node) return null;
    var s = stage.getBoundingClientRect();
    var r = node.getBoundingClientRect();
    if (!r.width) return null;
    return {
      left: r.left - s.left, right: r.right - s.left,
      top: r.top - s.top, bottom: r.bottom - s.top,
      cx: (r.left + r.right) / 2 - s.left,
      cy: (r.top + r.bottom) / 2 - s.top
    };
  }

  function path(d, cls, color) {
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d);
    p.setAttribute("class", cls);
    if (color) p.setAttribute("stroke", color);
    svg.appendChild(p);
  }

  function draw() {
    var d = task();
    var w = Math.max(1, Math.ceil(stage.scrollWidth || stage.offsetWidth || 1));
    var h = Math.max(1, Math.ceil(stage.scrollHeight || stage.offsetHeight || 1));
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("width", String(w));
    svg.setAttribute("height", String(h));
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    var lead = rectOf(layout.lead);
    var chips = layout.groups.map(function (g) { return { g: g, r: rectOf(g.chip) }; }).filter(function (c) { return c.r; });

    if (lead && chips.length) {
      var tops = chips.map(function (c) { return c.r.top; });
      var busY = lead.bottom + Math.max(14, (Math.min.apply(null, tops) - lead.bottom) / 2);
      path("M " + lead.cx + " " + lead.bottom + " V " + busY, "mmo-branch");
      var xs = chips.map(function (c) { return c.r.cx; });
      var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
      if (maxX - minX > 0.5) path("M " + minX + " " + busY + " H " + maxX, "mmo-branch");
      chips.forEach(function (c) { path("M " + c.r.cx + " " + busY + " V " + c.r.top, "mmo-branch"); });
    }

    layout.groups.forEach(function (g) {
      var chip = rectOf(g.chip);
      var rs = g.members.map(rectOf).filter(Boolean);
      if (!chip || !rs.length) return;
      var color = GROUP_COLORS[g.gi % GROUP_COLORS.length];
      var busY = Math.min.apply(null, rs.map(function (r) { return r.top; })) - 12;
      path("M " + chip.cx + " " + chip.bottom + " V " + busY, "mmo-branch", color);
      var xs = rs.map(function (r) { return r.cx; });
      var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
      if (maxX - minX > 0.5) path("M " + minX + " " + busY + " H " + maxX, "mmo-branch", color);
      rs.forEach(function (r) { path("M " + r.cx + " " + busY + " V " + r.top, "mmo-branch", color); });
    });

    var edges = [];
    function push(e, kind) {
      if (!e || e.status === "completed") return;
      var a = rectOf(cards[e.from]), b = rectOf(cards[e.to]);
      if (!a || !b) return;
      edges.push({ a: a, b: b, kind: kind, status: e.status });
    }
    d.dispatch.forEach(function (e) { push(e, "dispatch"); });
    d.dependency.forEach(function (e) { push(e, "dep"); });

    edges.slice(0, MAX_EDGES).forEach(function (e, i) {
      var line;
      if (e.b.top >= e.a.bottom) {
        var yTop = Math.min(e.b.top - 8, e.a.bottom + 10);
        line = "M " + e.a.cx + " " + e.a.bottom + " V " + yTop +
            " H " + (e.b.left - 12) + " V " + (e.b.top - 8) +
            " H " + e.b.cx + " V " + e.b.top;
      } else if (e.b.bottom <= e.a.top) {
        var yBot = Math.max(e.b.bottom + 8, e.a.top - 10);
        line = "M " + e.a.cx + " " + e.a.top + " V " + yBot +
            " H " + (e.b.left - 12) + " V " + (e.b.bottom + 8) +
            " H " + e.b.cx + " V " + e.b.bottom;
      } else {
        var laneY = Math.max(e.a.bottom, e.b.bottom) + 12 + (i % 3) * 6;
        line = "M " + e.a.cx + " " + e.a.bottom + " V " + laneY + " H " + e.b.cx + " V " + e.b.bottom;
      }
      path(line, "mmo-edge" + (e.status === "in_progress" ? " mmo-edge-active" : ""), e.kind === "dep" ? "#b45309" : "#2f6feb");
    });
  }

  var WORKS = [
    "任务作用域与参与者识别", "任务下拉与作用域渲染", "复核层级与连接线", "整理变更说明",
    "本地 ollama 冒烟验证", "核对 token 用量", "补一条任务切换测试"
  ];

  function tick() {
    var d = task();
    var advancing = [d.lead];
    d.groups.forEach(function (g) { g.members.forEach(function (m) { if (m.status === "running") advancing.push(m); }); });
    advancing.forEach(function (m) {
      m.tokens += 300 + Math.floor(Math.random() * 2400);
      m.elapsed += 2000;
      if (Math.random() < 0.12) m.requests += 1;
    });
    var pool = [];
    d.groups.forEach(function (g) { g.members.forEach(function (m) { pool.push(m); }); });
    if (pool.length && Math.random() < 0.14) {
      var person = pool[Math.floor(Math.random() * pool.length)];
      if (person.status === "running") {
        person.status = "idle";
        person.work = null;
        person.elapsed = 0;
      } else {
        person.status = "running";
        person.work = { subject: WORKS[Math.floor(Math.random() * WORKS.length)], status: "in_progress" };
      }
    }
    d.updated = Date.now();
    render();
  }

  var centered = false;
  function centerViewport() {
    if (centered) return;
    var over = stage.scrollWidth - canvas.clientWidth;
    if (over > 8) {
      var lead = leadRow.firstChild;
      if (lead) {
        var lr = lead.getBoundingClientRect(), sr = stage.getBoundingClientRect();
        var cx = lr.left + lr.width / 2 - sr.left;
        canvas.scrollLeft = Math.max(0, Math.min(over, cx - canvas.clientWidth / 2));
        centered = true;
      }
    } else if (over <= 8) {
      centered = true;
    }
  }
  var _draw = draw;
  draw = function () { _draw(); centerViewport(); };

  taskSel.addEventListener("change", function () {
    var idx = -1;
    TASKS.forEach(function (t, i) { if (t.id === taskSel.value) idx = i; });
    if (idx >= 0) current = idx;
    centered = false;
    render();
  });

  render();
  setInterval(tick, 2000);
})();
</script>
</body>
</html>
